[package]
name = "fototriagem"
version = "1.0.0"
description = "GS PhotoTriage - Ultra-minimalist photo triage desktop application."
authors = ["Joey Bernardes <followthepillow@gmail.com>"]
edition = "2021"

[lib]
name = "fototriagem_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
sha2 = "0.10"
chrono = "0.4"
unicode-normalization = "0.1"
regex = "1"
rayon = "1.8"
kamadak-exif = "0.5"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
