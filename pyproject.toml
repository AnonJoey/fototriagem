[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fototriagem"
version = "1.0.0"
description = "Triagem ultra-minimalista de fotos e vídeos por teclado, otimizada para Google Takeout."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Joey Bernardes", email = "followthepillow@gmail.com" }
]
keywords = ["photos", "triage", "google-takeout", "organizer", "pyside6", "minimalist"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]
dependencies = [
    "PySide6>=6.5.0",
    "Pillow>=10.0.0",
]

[project.scripts]
fototriagem = "fototriagem.cli:main"
triar = "fototriagem.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fototriagem*"]
exclude = ["tests*", "refs*"]
